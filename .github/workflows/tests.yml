name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps for evacam_py (yaml-cpp; OpenMP ships with g++)
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync (builds camasim and the evacam_py dependency from git)
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
